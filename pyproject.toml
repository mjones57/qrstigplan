[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "qrstigplan"
version = "0.1.0.dev0"
description = "Stigmergic multi-robot motion planning with QR-encoded paths"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"            
authors = [{ name = "Miles Jones" }]
dependencies = ["numpy>=2.0", "scipy>=1.11", "shapely>=2.0", "qrcode>=8.0"]

[project.optional-dependencies]
analysis = ["pandas>=2.2", "pyarrow>=15", "matplotlib>=3.8"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "qrstigplan[analysis]"]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--showlocals", "--import-mode=importlib"]
strict = true
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]